<style>
:root{--bg:#eef0ec;--card:#fff;--ink:#14202b;--mute:#5b6773;--line:#dfe2de;--push:#c9780a;--pull:#0f7f78;--legs:#5a4fcf;--core:#6b7280;--cardio:#c2410c;--accent:#f0a23a;--btn:#14202b;--btnink:#fff;--err:#b3261e;--shadow:0 1px 2px rgba(20,32,43,.06),0 10px 28px rgba(20,32,43,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1318;--card:#18202a;--ink:#eef1f3;--mute:#9aa6b2;--line:#27323d;--push:#f0a23a;--pull:#3fc4ba;--legs:#9a90f5;--core:#a3abb6;--cardio:#fb923c;--btn:#eef1f3;--btnink:#0e1318;--err:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1318;--card:#18202a;--ink:#eef1f3;--mute:#9aa6b2;--line:#27323d;--push:#f0a23a;--pull:#3fc4ba;--legs:#9a90f5;--core:#a3abb6;--cardio:#fb923c;--btn:#eef1f3;--btnink:#0e1318;--err:#ff8a80;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",system-ui,sans-serif;line-height:1.4}
[dir="rtl"] body,[dir="rtl"] h1,[dir="rtl"] h2,[dir="rtl"] button,[dir="rtl"] input{font-family:"Cairo","Segoe UI",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 16px 96px}
h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:1.7rem;margin:0;letter-spacing:.01em}
button{font-family:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hero{position:relative;display:flex;align-items:center;gap:16px;padding:44px 20px 22px;border-radius:20px;color:#fff;background:radial-gradient(circle at 85% 20%,rgba(240,162,58,.35),transparent 45%),linear-gradient(135deg,#0f2027 0%,#203a43 55%,#2c5364 100%);box-shadow:var(--shadow);margin-bottom:16px}
.hero svg{flex:none;color:var(--accent);fill:currentColor;width:70px;height:52px;filter:drop-shadow(0 3px 8px rgba(0,0,0,.35))}
.hero h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:2.4rem;line-height:1.05;margin:0;text-transform:uppercase;letter-spacing:.04em}
[dir="rtl"] .hero h1{letter-spacing:0;text-transform:none;font-weight:800}
.hero p{margin:4px 0 0;color:#cfdbe3;font-size:.9rem}
.hero .blk{display:inline-block;margin-top:8px;font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.14)}
.lang{position:absolute;top:12px;inset-inline-end:12px;display:flex;gap:4px}
.lang button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:4px 10px;font-weight:700;font-size:.8rem}
.lang button.on{background:var(--accent);color:#14202b;border-color:var(--accent)}
.big{background:var(--btn);color:var(--btnink);border:0;border-radius:12px;padding:14px 16px;font-weight:700;font-size:1.05rem;width:100%}
.big:disabled{opacity:.6}
.big.danger{background:var(--err);color:#fff}
.lnk{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:.9rem;padding:8px 4px}
.sm{background:transparent;color:var(--ink);border:1.5px solid var(--line);border-radius:8px;padding:7px 10px;font-weight:600;font-size:.85rem}
.sm.on{background:var(--btn);color:var(--btnink);border-color:var(--btn)}
.card,.ex{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--shadow)}
.fld{display:block;margin:10px 0;font-weight:600;font-size:.9rem}
.fld input,.log input{padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font-size:1rem;font-family:inherit}
.fld input{display:block;width:100%;margin-top:4px}
.err{color:var(--err);font-weight:600;margin:8px 0;min-height:1.2em}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 2px 12px}
.st{color:var(--mute);font-size:.8rem}
.tabs{display:flex;gap:4px;padding:4px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:16px;box-shadow:var(--shadow)}
.tabs button{flex:1;padding:11px 4px;border-radius:10px;border:0;background:transparent;color:var(--mute);font-weight:700;font-size:.8rem}
.tabs button.on{background:var(--btn);color:var(--btnink)}
.set{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.set small{display:block;color:var(--mute)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px}
.q{margin:12px 0 4px;font-weight:700;font-size:.92rem}
.pcard h3{margin:6px 0 2px;font-size:1.15rem}
.pcard p{margin:2px 0 8px;color:var(--mute);font-size:.9rem}
.pcard .for{color:var(--ink);font-weight:600}
.pcard.rec{border:2px solid var(--accent)}
.badge{display:inline-block;font-size:.72rem;font-weight:800;background:var(--accent);color:#14202b;padding:2px 8px;border-radius:99px;margin-inline-end:6px}
.why{font-size:.82rem;color:var(--pull);font-weight:600;margin:0 0 8px}
.key{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-block;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:99px;border:1.5px solid currentColor;margin-inline-end:4px}
.Push{color:var(--push)}.Pull{color:var(--pull)}.Legs{color:var(--legs)}.Core{color:var(--core)}.Cardio{color:var(--cardio)}
.lv-beginner{color:var(--pull)}.lv-intermediate{color:var(--push)}.lv-advanced{color:var(--cardio)}.lv-all{color:var(--legs)}.mu{color:var(--mute)}
.rules{font-size:.92rem;margin-bottom:20px}
.rules b{display:block;margin-top:8px}.rules b:first-child{margin-top:0}
section{margin-bottom:24px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:0 2px 10px;flex-wrap:wrap}
.dayhead small{color:var(--mute);font-weight:600}
.today{font-size:.7rem;font-weight:800;letter-spacing:.06em;background:var(--accent);color:#14202b;padding:2px 8px;border-radius:99px}
.pe{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px;box-shadow:var(--shadow);color:var(--core)}
.num{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:currentColor}
.num span{color:var(--card)}
.name{font-weight:700;color:var(--ink)}
.meta{font-size:.85rem;color:var(--mute)}.meta span{font-weight:700}
a.go{background:var(--btn);color:var(--btnink);text-decoration:none;font-weight:700;font-size:.85rem;padding:8px 12px;border-radius:10px;white-space:nowrap}
.nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.nav button{background:var(--btn);color:var(--btnink);border:0;border-radius:10px;padding:9px 12px;font-weight:700;font-size:.85rem}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-size:.82rem;color:var(--mute);font-weight:600}
.pbar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pull),var(--accent));border-radius:99px;transition:width .4s}
.ex{border-inline-start:5px solid currentColor;color:var(--core)}
.log{display:flex;align-items:center;gap:6px;margin-top:6px;color:var(--mute);font-size:.85rem;flex-wrap:wrap}
.log input{width:70px;text-align:center;padding:7px 6px}
.log input::placeholder{color:var(--mute);opacity:.6}
.first{font-size:.82rem;color:var(--mute);margin-top:6px;font-weight:600}
details{margin-top:2px;font-size:.82rem;color:var(--mute)}
summary{cursor:pointer;padding:3px 0}
.hist div{padding:2px 0}
.note{color:var(--mute);font-size:.85rem;margin-top:18px}
.legal h3{margin:16px 0 4px;font-size:1.02rem}
.legal p{margin:0;font-size:.92rem}
.foot{text-align:center;color:var(--mute);font-size:.85rem;margin-top:34px;padding-top:16px;border-top:1px solid var(--line)}
.foot b{color:var(--ink)}
.sv{margin-inline-start:auto;font-weight:700}
.sv.ok{background:var(--pull);color:#fff;border-color:var(--pull)}
.ex.skipped{opacity:.65}
.quote{transition:opacity .35s;min-height:7em}
.quote .q2{display:block;margin-top:6px;opacity:.85;font-size:.85em;font-weight:400}
.quote small{display:block;margin-top:4px;color:var(--accent);font-weight:600;font-size:.75rem}
.gnum{font-size:2.8rem;font-weight:800;line-height:1;margin-top:6px;font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.gnum small{font-size:1rem;font-weight:600;color:var(--mute);font-family:inherit}
.nres{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.nres div{background:var(--bg);border-radius:10px;padding:8px 10px}
.nres b{display:block;font-size:1.25rem}
.nres span{color:var(--mute);font-size:.8rem}
.mrow{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem}
.skt{font-size:.82rem;font-weight:700;color:var(--accent);margin-top:4px;min-height:0}
.nt{width:100%;margin-top:4px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem;resize:vertical}
.skt.prt{color:var(--pull)}
.streak{display:flex;gap:6px 12px;align-items:center;flex-wrap:wrap;font-weight:700}
.streak span{color:var(--mute);font-weight:600;font-size:.9rem}
a.big{display:block;text-align:center;text-decoration:none}
.cpm{font-size:.85rem;color:var(--pull);font-weight:600;min-height:1.2em;margin:4px 2px}
#rt{position:fixed;inset-inline:0;bottom:0;display:flex;justify-content:center;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));pointer-events:none;z-index:20}
#rt>*{pointer-events:auto}
.rtb{background:var(--btn);color:var(--btnink);border:0;border-radius:99px;padding:12px 20px;font-weight:700;box-shadow:var(--shadow)}
.rtp{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.25);display:flex;flex-direction:column;gap:8px;align-items:center;max-width:420px;width:100%}
.rtp.run,.rtp.done{flex-direction:row;justify-content:space-between}
.rtp b#rtt{font-size:1.9rem;font-variant-numeric:tabular-nums}
.rtp.done{border-color:var(--accent);background:var(--accent);color:#14202b}
.rtp.done .sm{color:#14202b;border-color:#14202b}
.auto{font-size:.85rem;color:var(--mute);display:flex;gap:6px;align-items:center}
#view,.login{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#view,.login{animation:none}.pbar i{transition:none}}
</style>

function bar(){

h+='<div class="prog"><div class="pbar"><i id="pf"></i></div><span id="pt"></span></div>';
h+='<div class="ex" data-k="bodyweight" data-u="w"><div class="name">'+esc(t("body"))+'</div><div class="log">'+ins(1)+'<span>'+esc(ulab("w"))+'</span><button class="sm sv">'+esc(t("save"))+'</button></div><div class="first"></div><details><summary>'+esc(t("hist"))+'</summary><div class="hist"></div></details></div>';
S.forEach(function(d){h+='<section><div class="dayhead"><h2>'+esc(dn(d))+(dt(d)?': '+esc(dt(d)):'')+'</h2></div>';

h+='</section>'});

document.querySelectorAll(".ex[data-k]").forEach(function(box){

var cu=arr.filter(function(r){return r.d===cur})[0];
var pv=arr.filter(function(r){return r.d<cur&&has(r)}).sort(srt).pop();
var sb=box.querySelector(".sv"),sk=box.querySelector(".sk");
sb.onclick=function(){var any=false;inputs.forEach(function(x){if(x.value)any=true});if(!any)return;

var ta=box.querySelector(".nt");
if(ta){var nv=(store._notes&&store._notes[k])||"";ta.value=nv;if(nv)box.querySelector(".nsum").textContent=t("notes")+" ✎";

});

});

function paint(box,k){
var all=rd(k).filter(has).sort(srt),u=box.getAttribute("data-u")||"w";
box.querySelector(".first").textContent=all.length?(k==="bodyweight"?t("start"):t("first"))+" ("+t("week")+" "+fd(all[0].d)+"): "+fw(all[0].w,u):"";

box.querySelector(".hist").innerHTML=all.map(function(r){return "<div>"+esc(t("week"))+" "+esc(fd(r.d))+": "+esc(fw(r.w,u))+"</div>"}).join("")+chartHtml(k,all);
var pe=box.querySelector(".prt");
if(pe&&k!=="bodyweight"){var mxw=function(r){var m=0;r.w.forEach(function(v){var n=parseFloat(v);if(n>m)m=n});return m},cu2=rd(k).filter(function(r){return r.d===cur})[0],pr0=0,bs=0;
rd(k).forEach(function(r){if(r.w){if(r.d<cur)pr0=Math.max(pr0,mxw(r));bs=Math.max(bs,mxw(r))}});
var c0=cu2?mxw(cu2):0;pe.textContent=(pr0>0&&c0>pr0?"🏆 "+t("pr")+"  ":"")+(bs>0?t("bestW")+": "+bs+" "+ulab(u):"")}
}
