["What we collect","Your name, your email, your password (kept by Firebase Authentication, so we cannot see it), and what you type in the app: weights, body weight, and your chosen program, training days, equipment, language, unit, goal countdown, what you type in the nutrition calculator (sex, age, height, weight), and your exercise notes.","ما الذي نجمعه","اسمك وبريدك الإلكتروني وكلمة المرور (تحفظها خدمة Firebase Authentication ولا نستطيع رؤيتها)، وما تكتبه في التطبيق: الأوزان ووزن الجسم والبرنامج وأيام التمرين والمعدات واللغة والوحدة وهدف العد التنازلي، وما تكتبه في حاسبة التغذية (الجنس والعمر والطول والوزن)، وملاحظاتك على التمارين."],

function sat(ang,t,ccw){var dc=sp(jd+t).dec,x=(-Math.sin(ang*R)-Math.sin(dc*R)*Math.sin(lat*R))/(Math.cos(dc*R)*Math.cos(lat*R));if(x>1||x<-1)return NaN;

/* arccot(x)=atan(1/x) */ return sat(a,t,false)}
var rs=0.833,T={fajr:5/24,sunrise:6/24,dhuhr:12/24,asr:13/24,sunset:18/24,isha:18/24};
var r={fajr:sat(M.f,T.fajr,true),sunrise:sat(rs,T.sunrise,true),dhuhr:mid(T.dhuhr),asr:asrT(asr===1?2:1,T.asr),maghrib:sat(rs,T.sunset,false)};
r.isha=M.im?r.maghrib+M.im/60:sat(M.i,T.isha,false);

if(sk)sk.onclick=function(){var r=rd(k).filter(function(z){return z.d===cur})[0];setSkip(k,inputs.length,!(r&&r.s));skState(box,k);bar()};
inputs.forEach(function(inp,i){
if(cu&&cu.w[i])inp.value=cu.w[i];
if(pv&&pv.w[i])inp.placeholder=pv.w[i];
inp.onchange=function(){save(k,i,inp.value,inputs.length);paint(box,k);bar();skState(box,k);if(rAuto&&inp.value&&k!=="bodyweight"&&!box.className.match(/Cardio/))startRest(rDur)};
});
paint(box,k);skState(box,k);
});
bar();
}
function paint(box,k){
var all=rd(k).filter(has).sort(srt),u=box.getAttribute("data-u")||"w";
box.querySelector(".first").textContent=all.length?(k==="bodyweight"?t("start"):t("first"))+" ("+t("week")+" "+fd(all[0].d)+"): "+fw(all[0].w,u):"";
box.querySelector("summary").textContent=t("hist")+" ("+all.length+")";
box.querySelector(".hist").innerHTML=all.map(function(r){return "<div>"+esc(t("week"))+" "+esc(fd(r.d))+": "+esc(fw(r.w,u))+"</div>"}).join("")+chartHtml(k,all);
var pe=box.querySelector(".prt");
if(pe&&k!=="bodyweight"){var mxw=function(r){var m=0;r.w.forEach(function(v){var n=parseFloat(v);if(n>m)m=n});return m},cu2=rd(k).filter(function(r){return r.d===cur})[0],pr0=0,bs=0;
rd(k).forEach(function(r){if(r.w){if(r.d<cur)pr0=Math.max(pr0,mxw(r));bs=Math.max(bs,mxw(r))}});
var c0=cu2?mxw(cu2):0;pe.textContent=(pr0>0&&c0>pr0?"🏆 "+t("pr")+"  ":"")+(bs>0?t("bestW")+": "+bs+" "+ulab(u):"")}
}

/* ---------- Start ---------- */
applyLang();
if("serviceWorker" in navigator)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
if(!ready){setup()}else{
firebase.initializeApp(cfg);auth=firebase.auth();db=firebase.firestore();
shell('<p class="note">'+esc(t("loading"))+'</p>');
auth.onAuthStateChanged(function(u){
if(!u){user=null;store={};program="";trainDays=[];choosing=false;tab="plan";delOpen=false;show();return}
user=u;notice="";
db.collection("users").doc(u.uid).get().then(function(d){
var x=d.exists?d.data():null;
if(!x){x={name:pendingName||u.email,data:"{}",lang:lang,program:"",unit:unitPref,days:[],equip:equip};db.collection("users").doc(u.uid).set(x)}
try{store=JSON.parse(x.data||"{}")}catch(e){store={}}
var mg=migrate();if(migrateLegacy())mg=true;
uname=x.name||u.email;
if(x.lang==="ar"||x.lang==="en"){lang=x.lang;ls("gymlang",lang)}
if(x.unit==="kg"||x.unit==="lb"){unitPref=x.unit;ls("gymunit",unitPref)}
if(EQK[x.equip]){equip=x.equip;ls("gymequip",equip)}
trainDays=Array.isArray(x.days)?sortDays(x.days.filter(function(d){return WD.indexOf(d)>=0})):[];
program=PROGRAMS.some(function(p){return p.id===x.program})?x.program:"";
tab="plan";show();if(mg)persist();
}).catch(function(){shell('<div class="card">'+esc(t("fail"))+'</div>')});
});
}
